name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: true

      - name: Install Android API 37
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build lite debug APK (arm64)
        run: |
          ./gradlew :app:assembleLiteStandardDebug \
            -PsplitApks \
            --stacktrace \
            --no-daemon \
            --max-workers=2

      - name: Check permissions (fail if INTERNET is present)
        run: |
          set -e
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          APK=$(ls app/build/outputs/apk/liteStandard/debug/*arm64-v8a*.apk | head -n 1)
          echo "APK: $APK"
          "$AAPT2" dump permissions "$APK" | tee permissions.txt
          if grep -q "android.permission.INTERNET" permissions.txt; then
            echo "::error::INTERNET permission found in the APK"
            exit 1
          fi
          echo "OK: no INTERNET permission"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fold-ime-apk
          path: |
            app/build/outputs/apk/liteStandard/debug/*arm64-v8a*.apk
            permissions.txt
